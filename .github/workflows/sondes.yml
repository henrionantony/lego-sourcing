name: Sonde magasins
# Test manuel : quels sites de magasins répondent à un robot depuis GitHub (lecture seule).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 code/sondes.py Leclerc Auchan Lego.com
