name: Alertes Lego

# Un passage dure presque 6 heures (le maximum de GitHub) et vérifie Dealabs
# toutes les 30 secondes. Le déclenchement horaire n'est qu'un filet : GitHub en
# saute beaucoup, mais un passage en attente démarre dès que le précédent finit.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: alertes
  cancel-in-progress: false

# Droits minimum : le passage lit le dépôt, il n'écrit rien dessus.
permissions:
  contents: read
  actions: write  # seulement pour relancer le passage suivant (fin du fichier)

jobs:
  alertes:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      # Facultatifs : avec eux, les alertes voient le stock, la trésorerie et les deals déjà envoyés.
      # Le destinataire Telegram est dans les réglages privés (Supabase).
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pandas pillow
      # Table des prix et réglages : dans l'espace privé de Supabase, rien dans ce dépôt public
      - name: Fichiers privés
        working-directory: code
        run: python3 prive.py recevoir ../data
      - name: Deals déjà vus
        uses: actions/cache/restore@v4
        with:
          path: |
            data/cache/alertes_vus.json
            data/cache/vignettes
          key: vus-${{ github.run_id }}
          restore-keys: vus-
      - name: Vérifier Dealabs toutes les 30 secondes et rafraîchir l'application
        working-directory: code
        run: |
          # Application LEGO HQ (GitHub Pages) : recalculée dès qu'un deal arrive ou qu'un
          # bouton est touché dans l'appli (vérifié toutes les 5 s, immédiat). 25/11 (quota Supabase gratuit 5 Go/mois) :
          # sinon toutes les heures de 8h à 23h (Paris), et un nouveau deal ne relance l'appli que 15 min après la dernière fois.
          # Une erreur de l'application ne bloque jamais les alertes.
          appli() {
            [ -e /tmp/appli.encours ] && return
            touch /tmp/appli.encours
            ( timeout 240 python3 app_github.py > /tmp/appli.log 2>&1 || { echo "application en erreur (détail dans la base)"; python3 prive.py journal application < /tmp/appli.log; }; rm -f /tmp/appli.encours ) &
            derniere=$(date +%s)
            prochaine=$(( derniere + 3600 ))
          }
          fin=$(( $(date +%s) + 20700 ))
          prochaine=0
          derniere=0
          while [ "$(date +%s)" -lt "$fin" ]; do
            # Journal public réduit aux compteurs : le détail d'une erreur va dans la base privée
            if sortie=$(python3 alertes.py 2>&1); then
              echo "$sortie" | grep -E "^[0-9]+ nouveaux deals" | sed "s/ (envoy.*//" | tail -n 1
            else
              echo "passage en erreur (détail dans la base), on continue"
              echo "$sortie" | python3 prive.py journal alertes || true
            fi
            heure=$(TZ=Europe/Paris date +%H)
            if [ "$heure" -ge 8 ] && [ "$heure" -lt 23 ]; then
              maintenant=$(date +%s)
              if { echo "$sortie" | grep -qE "^[1-9][0-9]* nouveaux deals" && [ "$maintenant" -ge $(( derniere + 900 )) ]; } || [ "$maintenant" -ge "$prochaine" ]; then
                appli
              fi
            fi
            for i in 1 2 3 4 5 6; do
              sleep 5
              if [ ! -e /tmp/appli.encours ] && python3 gestes_attente.py; then appli; fi
            done
          done
          # Fin normale du passage : ne pas finir sur le code du dernier test (affiché en erreur dans l'appli)
          true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/cache/alertes_vus.json
            data/cache/vignettes
          key: vus-${{ github.run_id }}
      # Relais (17/11) : GitHub saute souvent le déclenchement horaire (jusqu'à 3-4 h sans
      # alertes). Le passage relance donc lui-même le suivant en finissant. Pas de relance
      # s'il a été annulé exprès (nouvelle version publiée, qui lance son propre passage).
      - name: Relancer le passage suivant
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run alertes.yml --ref main -R ${{ github.repository }}
