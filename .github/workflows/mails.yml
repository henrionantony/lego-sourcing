name: Mails

# Lit par règles fixes les mails de la boîte dédiée : annonces Leboncoin en ligne /
# supprimées, suivis de colis, cashbacks iGraal en attente (code/mails_imap.py).
# Le reste est laissé au passage de Claude. Lecture seule de la boîte ;
# le journal n'affiche que des nombres (dépôt public).
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

concurrency:
  group: mails
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mails:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GMAIL_ADRESSE: ${{ secrets.GMAIL_ADRESSE }}
      GMAIL_MOT_DE_PASSE: ${{ secrets.GMAIL_MOT_DE_PASSE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mails
        working-directory: code
        run: python3 mails_imap.py
